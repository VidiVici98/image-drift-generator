version: 2

updates:
  # --------------------------------------------------
  # Python dependencies (requirements.txt)
  # --------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Avoid surprise breaking changes unless explicitly wanted
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # --------------------------------------------------
  # GitHub Actions (CI/CD, security updates)
  # --------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # --------------------------------------------------
  # npm (tooling only — pre-commit, CI helpers if present)
  # Safe even if package.json does not exist yet
  # --------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
